<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" href="image/dwija-logo.png">

<link rel="icon" sizes="192x192" href="image/dwija-logo.png">

<link rel="apple-touch-icon" href="image/dwija-logo.png">

<meta property="og:image" content="https://dwija.org/image/dwija-logo.png">
    <meta charset="UTF-8">
    <title>D-ROBOTICS | Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root{--navy:#081a3a; --navy-light: #16408b;}
        *{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}

        body{
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background: linear-gradient(rgba(8,26,58,.7),rgba(8,26,58,.7)), url("image/rob1-img.png");
            background-size:cover;
            background-position:center;
            background-attachment:fixed;
            padding: 20px; /* Prevents card from touching screen edges on mobile */
        }

        /* Responsive Home Button */
        .home-btn{
            position:absolute;
            top:20px; left:20px;
            background:white; color:var(--navy);
            width: 45px; height: 45px;
            display: flex; align-items: center; justify-content: center;
            border-radius:50%;
            text-decoration:none; font-size:18px;
            z-index:10;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            transition: 0.3s;
        }
        .home-btn:hover { transform: scale(1.1); background: var(--navy); color: white; }

        .login-card{
            width:100%;
            max-width:400px;
            background:white;
            padding: 40px 30px;
            border-radius:24px;
            text-align:center;
            color:var(--navy);
            box-shadow:0 25px 50px rgba(0,0,0,.3);
            position: relative;
        }

        .login-card img{ height:65px; margin-bottom:15px; }
        .login-card h2{ margin-bottom:8px; font-weight: 700; color: var(--navy); }
        .login-card p.subtitle { color: #666; font-size: 14px; margin-bottom: 25px; }

        .input-group { text-align: left; margin-bottom: 15px; }
        .input-group label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 5px; color: #555; text-indent: 5px; }

        .login-card input{
            width:100%; padding:14px;
            border-radius:12px; border:1px solid #ccd9ff;
            outline: none; font-size: 15px;
            transition: 0.3s;
        }
        .login-card input:focus { border-color: var(--navy); box-shadow: 0 0 0 3px rgba(8,26,58,0.1); }

        .login-card button{
            width:100%; padding:14px; margin-top: 10px;
            background:var(--navy); color:white;
            border:none; border-radius:30px;
            font-size:16px; font-weight:600;
            cursor:pointer;
            transition: 0.3s;
        }
        .login-card button:hover:not(:disabled){ background:var(--navy-light); transform: translateY(-2px); }
        .login-card button:disabled{ opacity:.6; cursor:not-allowed; }

        .footer-text { margin-top:20px; font-size:14px; color: #555; }
        .footer-text a { color:var(--navy); font-weight: 600; text-decoration: none; }
        .footer-text a:hover { text-decoration: underline; }

        /* Mobile specific adjustments */
        @media (max-width: 480px) {
            .login-card { padding: 30px 20px; }
            .login-card h2 { font-size: 22px; }
            .home-btn { top: 15px; left: 15px; width: 40px; height: 40px; font-size: 16px; }
        }
    </style>
</head>

<body>

<a href="d-robotics.html" class="home-btn" title="Back to Home"><i class="fas fa-house"></i></a>

<div class="login-card">
    <img src="image/dwija-logo.png" alt="DWIJA">
    <h2>Welcome Back</h2>
    <p class="subtitle">Log in to your D-ROBOTICS account</p>

    <div class="input-group">
        <label>EMAIL ADDRESS</label>
        <input id="email" type="email" placeholder="name@example.com">
    </div>

    <div class="input-group">
        <label>PASSWORD</label>
        <input id="password" type="password" placeholder="••••••••">
    </div>

    <button id="loginBtn">Login</button>

    <p class="footer-text">Don't have an account? <a href="register.html">Register</a></p>
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {
    const SUPABASE_URL = "https://tvyllslbogeeaaqxywin.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR2eWxsc2xib2dlZWFhcXh5d2luIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjY3MjcxOTQsImV4cCI6MjA4MjMwMzE5NH0.NvuBeCH5VSPQe88DRxohU0mRcRhV8u1_OsocIi8Vlsk";
    
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const loginBtn = document.getElementById("loginBtn");

    loginBtn.addEventListener("click", loginUser);
    
    document.addEventListener("keydown", (e) => {
        if (e.key === "Enter") loginUser();
    });

    async function loginUser() {
        if (loginBtn.disabled) return;

        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;

        if (!email || !password) {
            alert("Please enter both email and password.");
            return;
        }

        loginBtn.disabled = true;
        loginBtn.innerText = "Authenticating...";

        try {
            const { data, error } = await supabaseClient.auth.signInWithPassword({
                email: email,
                password: password
            });

            if (error) throw error;
            window.location.href = "d-robotics.html";

        } catch (error) {
            alert("Login failed: " + error.message);
            resetBtn();
        }
    }

    function resetBtn() {
        loginBtn.disabled = false;
        loginBtn.innerText = "Login";
    }
});
</script>
</body>
</html>
