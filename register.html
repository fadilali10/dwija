<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" href="image/dwija-logo.png">

<link rel="icon" sizes="192x192" href="image/dwija-logo.png">

<link rel="apple-touch-icon" href="image/dwija-logo.png">

<meta property="og:image" content="https://dwija.org/image/dwija-logo.png">
    <meta charset="UTF-8">
    <title>D-ROBOTICS | Register</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root{--navy:#081a3a; --navy-light: #16408b;}
        *{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}

        body{
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background: linear-gradient(rgba(8,26,58,.7),rgba(8,26,58,.7)), url("image/rob1-img.png");
            background-size:cover;
            background-position:center;
            background-attachment:fixed;
            padding: 40px 20px; /* Space for mobile scrolling */
        }

        /* Responsive Home Button */
        .home-btn{
            position:absolute;
            top:20px; left:20px;
            background:white; color:var(--navy);
            width: 45px; height: 45px;
            display: flex; align-items: center; justify-content: center;
            border-radius:50%;
            text-decoration:none; font-size:18px;
            z-index:10;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            transition: 0.3s;
        }
        .home-btn:hover { transform: scale(1.1); background: var(--navy); color: white; }

        .register-card{
            width:100%;
            max-width:480px;
            background:white;
            padding: 40px 30px;
            border-radius:24px;
            text-align:center;
            color:var(--navy);
            box-shadow:0 25px 50px rgba(0,0,0,.45);
            position: relative;
        }

        .register-card img{ height:60px; margin-bottom:10px; }
        .register-card h2{ margin-bottom:5px; font-weight: 700; }
        .register-card p.subtitle { color: #666; font-size: 14px; margin-bottom: 25px; }

        /* Form Layout */
        .form-grid { text-align: left; }
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; font-size: 11px; font-weight: 700; margin-bottom: 5px; color: #555; text-transform: uppercase; letter-spacing: 0.5px; }

        .register-card input{
            width:100%; padding:12px 15px;
            border-radius:12px; border:1px solid #ccd9ff;
            outline:none; font-size: 14px;
            transition: 0.3s;
        }
        .register-card input:focus { border-color: var(--navy); box-shadow: 0 0 0 3px rgba(8,26,58,0.1); }

        .register-card button{
            width:100%; padding:14px; margin-top: 15px;
            background:var(--navy); color:white;
            border:none; border-radius:30px;
            font-size:16px; font-weight:600;
            cursor:pointer;
            transition: 0.3s;
        }
        .register-card button:hover:not(:disabled){ background:var(--navy-light); transform: translateY(-2px); }
        .register-card button:disabled{ opacity:.6; cursor:not-allowed; }

        .footer-text { margin-top:20px; font-size:14px; color: #555; }
        .footer-text a { color:var(--navy); font-weight: 600; text-decoration: none; }
        .footer-text a:hover { text-decoration: underline; }

        /* Mobile specific adjustments */
        @media (max-width: 480px) {
            body { padding: 80px 15px 40px; } /* More top padding for home button space */
            .register-card { padding: 30px 20px; }
            .register-card h2 { font-size: 22px; }
            .home-btn { top: 15px; left: 15px; width: 40px; height: 40px; }
        }
    </style>
</head>
<body>

<a href="d-robotics.html" class="home-btn" title="Back to Home"><i class="fas fa-house"></i></a>

<div class="register-card">
    <img src="image/dwija-logo.png" alt="DWIJA">
    <h2>Create Account</h2>
    <p class="subtitle">Join the D-ROBOTICS community</p>

    <div class="form-grid">
        <div class="input-group">
            <label>Full Name</label>
            <input id="name" type="text" placeholder="Enter your full name" required>
        </div>

        <div class="input-group">
            <label>Phone Number</label>
            <input id="phone" type="tel" placeholder="10-digit mobile number" required>
        </div>

        <div class="input-group">
            <label>Aadhaar Number</label>
            <input id="aadhaar" type="text" placeholder="12-digit Aadhaar" required>
        </div>

        <div class="input-group">
            <label>Email Address</label>
            <input id="email" type="email" placeholder="name@example.com" required>
        </div>

        <div class="input-group">
            <label>Password</label>
            <input id="password" type="password" placeholder="Min. 6 characters" required>
        </div>

        <div class="input-group">
            <label>Date of Birth</label>
            <input id="dob" type="date" required>
        </div>
    </div>

    <button id="registerBtn">Register</button>

    <p class="footer-text">Already have an account? <a href="login.html">Login</a></p>
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {
    const SUPABASE_URL = "https://tvyllslbogeeaaqxywin.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR2eWxsc2xib2dlZWFhcXh5d2luIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjY3MjcxOTQsImV4cCI6MjA4MjMwMzE5NH0.NvuBeCH5VSPQe88DRxohU0mRcRhV8u1_OsocIi8Vlsk";
    
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const registerBtn = document.getElementById("registerBtn");

    async function hashText(text){
        const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
        return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,"0")).join("");
    }

    function setButtonLoading(isLoading) {
        if (isLoading) {
            registerBtn.disabled = true;
            registerBtn.innerText = "Creating Account...";
        } else {
            registerBtn.disabled = false;
            registerBtn.innerText = "Register";
        }
    }

    async function registerUser(){
        const name = document.getElementById("name").value.trim();
        const phone = document.getElementById("phone").value.trim();
        const aadhaar = document.getElementById("aadhaar").value.trim();
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;
        const dob = document.getElementById("dob").value;

        if(!name || !phone || !aadhaar || !email || !password || !dob){
            alert("All fields are required");
            return;
        }
        if(phone.length !== 10 || aadhaar.length !== 12 || password.length < 6){
            alert("Validation failed: Phone (10 digits), Aadhaar (12 digits), Password (min 6).");
            return;
        }

        setButtonLoading(true);

        try {
            const { data: authData, error: authError } = await supabaseClient.auth.signUp({
                email: email,
                password: password,
            });

            if (authError) throw authError;

            const user = authData.user;
            if (!user) throw new Error("Check your email for a verification link.");

            const aadhaarHash = await hashText(aadhaar);

            const { error: profileError } = await supabaseClient
                .from("profiles")
                .insert([{
                    id: user.id,
                    full_name: name,
                    phone: phone,
                    aadhaar: aadhaarHash,
                    dob: dob,
                    email: email
                }]);

            if (profileError) throw profileError;

            alert("Success! Check your email for verification.");
            window.location.href = "login.html";

        } catch (error) {
            alert("Error: " + error.message);
        } finally {
            setButtonLoading(false);
        }
    }

    registerBtn.addEventListener("click", registerUser);
});
</script>

</body>
</html>
